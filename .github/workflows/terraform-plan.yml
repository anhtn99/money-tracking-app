name: Terraform plan

# Runs on every PR that touches infra -- read-only, so safe to run
# unattended on any branch. This is the pipeline's "does this change look
# right" check; terraform-apply.yml is the separate, human-gated pipeline
# that actually applies anything.
on:
  pull_request:
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  TF_VERSION: "1.5.7"
  # Not sensitive, just required for `terraform plan` to run at all --
  # free-tier's variables.tf marks these `sensitive = true` so Terraform
  # itself won't echo the values in any log output either way.
  TF_VAR_plaid_client_id: ${{ secrets.PLAID_CLIENT_ID }}
  TF_VAR_plaid_secret: ${{ secrets.PLAID_SECRET }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra/terraform

  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Extend with full-textbook once that environment's Terraform exists.
        environment: [free-tier]
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY -- debugging the OIDC sub claim mismatch. Prints the
      # actual claims GitHub puts in the token for this run, so the IAM
      # trust policy's condition can be fixed to match reality instead of
      # documented assumption. Remove once the plan role works.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          " "$TOKEN"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: terraform plan
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform plan -input=false -no-color
